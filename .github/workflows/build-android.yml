name: Kunefe Android APK v1

on:
  push:
    branches: [android-build]
  workflow_dispatch:
    inputs:
      arch:
        description: "Mimari: arm64 (cogu telefon), arm, x86_64, x86 veya all"
        required: false
        default: "arm64"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Imza anahtari (istege bagli ama onerilir): bkz. README_TR.md
      KS_B64: ${{ secrets.KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Zalith Launcher 2 (sabitlenmis surum)
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: f735ed6e2ac514804e17cb8aa37f7ce7c4c82bdc
          submodules: recursive

      - name: Kunefe dosyalari
        uses: actions/checkout@v6
        with:
          path: kunefe-overlay

      - name: Kunefe yamasini uygula
        run: git apply --whitespace=nowarn kunefe-overlay/android/kunefe.patch

      - name: Ikon arka plan rengini duzelt
        run: |
          cat > ZalithLauncher/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#101012</color>
          </resources>
          XML
          sed -i 's/^          //' ZalithLauncher/src/main/res/values/ic_launcher_background.xml
          cat ZalithLauncher/src/main/res/values/ic_launcher_background.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
          key: petlib-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock') }}
          restore-keys: petlib-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Imza anahtari
        run: |
          cd ZalithLauncher
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > zalith_launcher.jks
            PASS="$KS_PASS"
            echo "Kayitli imza anahtari kullaniliyor."
          else
            PASS="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
            rm -f zalith_launcher.jks
            keytool -genkeypair -v -keystore zalith_launcher.jks -alias movtery_zalith \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=KunefeCraft" >/dev/null
            echo "::warning::Kayitli imza anahtari yok: bu APK her derlemede farkli imzalanir. Guncellemek icin eskisini silip kurman gerekir. README_TR.md'deki anahtar adimini uygula."
          fi
          echo "::add-mask::$PASS"
          echo "STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Modpack (.mrpack) uret ve APK icine koy
        run: |
          python3 kunefe-overlay/android/make_mrpack.py
          mkdir -p ZalithLauncher/src/main/assets
          cp KunefeCraft-Android-*.mrpack ZalithLauncher/src/main/assets/kunefe.mrpack

      - name: APK derle (${{ inputs.arch || 'arm64' }})
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=${{ inputs.arch || 'arm64' }}

      - name: APK yukle
        uses: actions/upload-artifact@v7
        with:
          name: KunefeLauncher-APK-${{ inputs.arch || 'arm64' }}
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Modpack yukle
        uses: actions/upload-artifact@v7
        with:
          name: KunefeCraft-modpack
          path: KunefeCraft-Android-*.mrpack

      - name: GitHub Release olarak yayinla (v1)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp ZalithLauncher/build/outputs/apk/release/*.apk /tmp/KunefeLauncher-v1-arm64.apk
          sha256sum /tmp/KunefeLauncher-v1-arm64.apk
          gh release delete android-v1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-v1 /tmp/KunefeLauncher-v1-arm64.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "KunefeLauncher Android v1" \
            --notes "KunefeCraft Android v1 (arm64). Ilk acilista Minecraft 1.21.11 + Fabric + modlar otomatik kurulur."
